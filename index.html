
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog</title> 
    <style>
      header { 
        background-color: #F97EC2;
        color: #000000;
        text-align: center;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
      }

      main {
        background-color: #b87fa2;
        color: #b14781;
        max-width: 800px;
        margin: 0 auto;
        padding: 16px;
        display: flex;
        gap: 16px; /* Adicionado um espaço entre a imagem e o texto */
        align-items: center; /* Alinha a imagem verticalmente com o texto */
      }

      img {
        width: 80px;
        height: 80px;
        object-fit: cover; /* Mantém a proporção da imagem sem distorcer */
      }

      /* Estilo adicionado aqui */
      .artigo-autor {
        font-weight: bold;
      }
    </style>
</head>
<body>
  <header>
    <h1>Meu blog tech</h1>
    <p>vou compartilhar conhecimentos sobre tecnologia e programação</p>
  </header>

  <main>
    <img src="images.jpeg" alt="Pixie (Megan Gwynn) dos X-Men com cabelo rosa vibrante e asas roxas de fada, segurando a Adaga da Alma brilhante em tom rosa mágico, com uma expressão determinada e marcas de batalha no corpo."> 
    <div>
      <h2>Meu primeiro post</h2>
      <p>Por: Eduarda Soares</p>
      <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
    </div>
  </main>
</body>
</html>
